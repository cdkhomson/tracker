<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HULA Score Tracker</title>
    <style>
        :root {
            --bg-color: #333333;
            --panel-bg: #4A4A4A;
            --accent: #FF3366; /* Hot pink from prototype */
            --text: #FFFFFF;
            --table-border: #666666;
            --guide-color: rgba(255, 255, 255, 0.9);
        }
        
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text); 
            display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; 
        }
        
        /* Layout Containers */
        #top-container { 
            position: relative; 
            flex: 0 0 50%; /* Top half */
            background: #000; 
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        #table-container { 
            flex: 1; 
            background: var(--panel-bg); 
            overflow-y: auto; 
            display: flex; flex-direction: column;
        }

        #bottom-controls { 
            background: #1A1A1A; 
            padding: 20px 15px; 
            display: flex; justify-content: center; align-items: center; gap: 15px; 
            border-top: 1px solid #000;
        }

        /* Video & Canvas */
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 2; pointer-events: none; }
        
        /* Target Guide Overlay */
        #target-guide { 
            position: absolute; 
            width: 70%; aspect-ratio: 1; 
            z-index: 3; 
            display: flex; justify-content: center; align-items: center; 
            pointer-events: none;
        }
        #target-guide::before, #target-guide::after, #target-guide-inner::before, #target-guide-inner::after {
            content: ''; position: absolute; width: 30px; height: 30px; border: 3px solid var(--guide-color);
        }
        #target-guide::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        #target-guide::after { top: 0; right: 0; border-left: none; border-bottom: none; }
        #target-guide-inner { position: absolute; width: 100%; height: 100%; }
        #target-guide-inner::before { bottom: 0; left: 0; border-right: none; border-top: none; }
        #target-guide-inner::after { bottom: 0; right: 0; border-left: none; border-top: none; }
        
        .guide-text {
            position: absolute; top: -30px; width: 100%; text-align: center;
            font-size: 14px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Overlays */
        .overlay-msg { 
            position: absolute; z-index: 4; 
            background: rgba(0,0,0,0.7); padding: 10px 20px; 
            border-radius: 8px; font-weight: bold; font-size: 18px;
            display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        .overlay-msg.active { display: block; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .msg-error { color: #FF4444; }
        .msg-success { color: #44FF44; }
        .msg-info { color: #FFFFFF; }

        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Table */
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 16px; }
        th { background: #333; padding: 12px; position: sticky; top: 0; font-weight: 600; text-transform: uppercase; font-size: 14px; color: #BBB; border-bottom: 2px solid var(--table-border); z-index: 10; }
        td { padding: 14px 10px; border-bottom: 1px solid var(--table-border); }
        tbody tr:nth-child(even) { background-color: rgba(0,0,0,0.1); }
        
        .table-footer { 
            background: #222; padding: 15px; 
            display: flex; justify-content: space-around; 
            font-weight: bold; font-size: 18px;
            border-top: 2px solid var(--table-border);
            margin-top: auto;
        }

        /* Buttons */
        button { 
            background: var(--accent); color: white; border: none; 
            padding: 14px 28px; border-radius: 6px; 
            font-size: 16px; font-weight: 700; cursor: pointer; 
            text-transform: uppercase; transition: all 0.2s; 
            flex: 1; max-width: 200px;
        }
        button:active { transform: scale(0.96); opacity: 0.8; }
        .btn-outline { background: transparent; border: 2px solid var(--accent); color: var(--accent); }
        .btn-dark { background: #333; color: #FFF; border: 1px solid #555; }

        /* Setup Screen Overlay */
        #setup-overlay {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%);
        }

        /* Loading Screen */
        #loading { position: fixed; inset: 0; background: var(--bg-color); z-index: 100; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--accent); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Utilities */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div style="font-weight:bold; font-size: 18px;">Initializing Engine...</div>
    </div>

    <!-- Top: Video Feed & CV Canvas -->
    <div id="top-container">
        <video id="video-feed" autoplay playsinline muted></video>
        <canvas id="cv-canvas"></canvas>
        
        <div id="target-guide">
            <div id="target-guide-inner"></div>
            <div class="guide-text">Align target with guides in frame</div>
        </div>
        
        <div id="overlay-msg" class="overlay-msg"></div>
        
        <div id="setup-overlay">
            <button id="btn-start" style="width: 100%; max-width: 100%;">Start Tracking / Capture Baseline</button>
        </div>
    </div>

    <!-- Middle: Dashboard Table -->
    <div id="table-container" class="hidden">
        <div style="flex:1; overflow-y:auto;">
            <table id="score-table">
                <thead>
                    <tr>
                        <th>Shot</th>
                        <th>Time</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="score-body">
                    <!-- Rows dynamically added -->
                </tbody>
            </table>
        </div>
        <div class="table-footer">
            <span>Total: <span id="total-shots">0</span></span>
            <span>Time: <span id="clock-display">0:00</span></span>
            <span>Score: <span id="total-score">0</span></span>
        </div>
    </div>

    <!-- Bottom: Controls -->
    <div id="bottom-controls" class="hidden">
        <button id="btn-track">Track</button>
        <button id="btn-reset" class="btn-outline">Reset</button>
        <button id="btn-end" class="btn-dark">End</button>
    </div>

    <!-- Include OpenCV.js -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>

    <script>
        let video = document.getElementById('video-feed');
        let canvas = document.getElementById('cv-canvas');
        let streaming = false;

        let baselineMat = null;
        let centerPoint = null;
        let pxPerMm = null;
        let perspectiveTransform = null;
        let warpedWidth = 600; // Standardized processing size, increased for better precision
        let warpedHeight = 600;

        let shots = [];
        let totalScore = 0;
        let startTime = null;
        let clockInterval = null;
        let isTracking = false;
        let wakeLock = null;

        // UI Elements
        const btnStart = document.getElementById('btn-start');
        const btnTrack = document.getElementById('btn-track');
        const btnReset = document.getElementById('btn-reset');
        const btnEnd = document.getElementById('btn-end');
        
        const scoreBody = document.getElementById('score-body');
        const totalShotsEl = document.getElementById('total-shots');
        const totalScoreEl = document.getElementById('total-score');
        const clockDisplayEl = document.getElementById('clock-display');
        
        const overlayMsg = document.getElementById('overlay-msg');
        const targetGuide = document.getElementById('target-guide');
        const setupOverlay = document.getElementById('setup-overlay');
        const tableContainer = document.getElementById('table-container');
        const bottomControls = document.getElementById('bottom-controls');

        function showMessage(msg, type = 'info', duration = 2000) {
            overlayMsg.textContent = msg;
            overlayMsg.className = `overlay-msg active msg-${type}`;
            if(duration > 0) {
                setTimeout(() => { overlayMsg.classList.remove('active'); }, duration);
            }
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        console.log('Screen Wake Lock released');
                    });
                    console.log('Screen Wake Lock acquired');
                } catch (err) {
                    console.error(`Wake Lock error: ${err.name}, ${err.message}`);
                }
            } else {
                console.log('Wake Lock API not supported. Safari playing continuous video naturally resists sleep.');
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release()
                    .then(() => { wakeLock = null; });
            }
        }

        function onOpenCvReady() {
            document.getElementById('loading').style.display = 'none';
            startCamera();
        }

        function startCamera() {
            // Explicitly request the iPhone's rear camera (environment) and high resolution
            let constraints = { 
                video: { 
                    facingMode: 'environment', 
                    width: { ideal: 1920 }, 
                    height: { ideal: 1080 } 
                }, 
                audio: false 
            };
            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    
                    video.onplaying = () => {
                        streaming = true;
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                    };
                })
                .catch(function(err) {
                    console.error("Camera error:", err);
                    showMessage("Camera Access Required", "error", 0);
                });
        }

        function updateClock() {
            if(!startTime) return;
            let elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            let mins = Math.floor(elapsedSec / 60);
            let secs = elapsedSec % 60;
            clockDisplayEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        btnStart.addEventListener('click', () => {
            if(!streaming) return;
            requestWakeLock();
            captureBaseline();
        });

        btnTrack.addEventListener('click', () => {
            detectShot();
        });

        function captureBaseline() {
            showMessage("Capturing Baseline...", "info", 0);
            
            // Allow UI to update before heavy processing
            setTimeout(() => {
                let cap = new cv.VideoCapture(video);
                let frame = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
                cap.read(frame);
                
                let gray = new cv.Mat();
                cv.cvtColor(frame, gray, cv.COLOR_RGBA2GRAY);
                
                // Adaptive Thresholding to prevent harsh shadows from confusing the algorithm
                let thresh = new cv.Mat();
                cv.adaptiveThreshold(gray, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 15, 5);
                
                // Perspective Warp Correction: Try to find the target paper contour
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                
                let largestArea = 0;
                let targetContour = null;
                
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    if (area > video.videoWidth * video.videoHeight * 0.1) {
                        let approx = new cv.Mat();
                        let perimeter = cv.arcLength(cnt, true);
                        cv.approxPolyDP(cnt, approx, 0.05 * perimeter, true);
                        
                        if (approx.rows === 4 && area > largestArea) {
                            largestArea = area;
                            if(targetContour) targetContour.delete();
                            targetContour = approx.clone();
                        }
                        approx.delete();
                    }
                }
                
                let srcTri;
                let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, warpedWidth, 0, warpedWidth, warpedHeight, 0, warpedHeight]);
                
                if (targetContour) {
                    let pts = [];
                    for(let i=0; i<4; i++) {
                        pts.push({x: targetContour.data32S[i*2], y: targetContour.data32S[i*2+1]});
                    }
                    pts.sort((a,b) => a.y - b.y); 
                    let top = pts.slice(0, 2).sort((a,b) => a.x - b.x);
                    let bottom = pts.slice(2, 4).sort((a,b) => b.x - a.x);
                    
                    srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [top[0].x, top[0].y, top[1].x, top[1].y, bottom[0].x, bottom[0].y, bottom[1].x, bottom[1].y]);
                    targetContour.delete();
                } else {
                    // Fallback to Guide Bracket
                    let guideRect = targetGuide.getBoundingClientRect();
                    let videoRect = video.getBoundingClientRect();
                    let scaleX = video.videoWidth / videoRect.width;
                    let scaleY = video.videoHeight / videoRect.height;
                    
                    let gx = (guideRect.left - videoRect.left) * scaleX;
                    let gy = (guideRect.top - videoRect.top) * scaleY;
                    let gw = guideRect.width * scaleX;
                    let gh = guideRect.height * scaleY;
                    
                    srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [gx, gy, gx+gw, gy, gx+gw, gy+gh, gx, gy+gh]);
                }
                
                perspectiveTransform = cv.getPerspectiveTransform(srcTri, dstTri);
                
                let warpedFrame = new cv.Mat();
                cv.warpPerspective(frame, warpedFrame, perspectiveTransform, new cv.Size(warpedWidth, warpedHeight));
                
                let warpedGray = new cv.Mat();
                cv.cvtColor(warpedFrame, warpedGray, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(warpedGray, warpedGray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                
                let circles = new cv.Mat();
                // Extrapolate center of 10-ring from white outer rings
                cv.HoughCircles(warpedGray, circles, cv.HOUGH_GRADIENT, 1, warpedHeight / 4, 100, 30, warpedWidth * 0.1, warpedWidth * 0.45);
                
                if (circles.cols > 0) {
                    let x = Math.round(circles.data32F[0]);
                    let y = Math.round(circles.data32F[1]);
                    centerPoint = new cv.Point(x, y);

                    // Dynamic Calibration: Measure the pixel width of the black aiming mark
                    let binaryBlack = new cv.Mat();
                    cv.threshold(warpedGray, binaryBlack, 100, 255, cv.THRESH_BINARY_INV); // Isolate dark areas
                    
                    let blackContours = new cv.MatVector();
                    let blackHierarchy = new cv.Mat();
                    cv.findContours(binaryBlack, blackContours, blackHierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
                    
                    let bestBlackRadius = 0;
                    let minDistanceToCenter = Infinity;
                    
                    for (let i = 0; i < blackContours.size(); ++i) {
                        let cnt = blackContours.get(i);
                        let circle = cv.minEnclosingCircle(cnt);
                        let dist = Math.hypot(circle.center.x - x, circle.center.y - y);
                        
                        // We expect the black mark to be centered and of a reasonable radius
                        if (dist < warpedWidth * 0.1 && circle.radius > warpedWidth * 0.05) {
                            if (dist < minDistanceToCenter) {
                                minDistanceToCenter = dist;
                                bestBlackRadius = circle.radius;
                            }
                        }
                    }
                    
                    if (bestBlackRadius > 0) {
                        // The black aiming mark (rings 4 to 9) is physically 30.5mm in diameter
                        pxPerMm = (bestBlackRadius * 2) / 30.5;
                        console.log("Dynamic Calibration: pxPerMm =", pxPerMm);
                    } else {
                        // Fallback: use outer white ring from HoughCircles (Ring 1 = 45.5mm)
                        pxPerMm = (Math.round(circles.data32F[2]) * 2) / 45.5; 
                        console.warn("Could not dynamically isolate black aiming mark, falling back to outer ring size.");
                    }
                    
                    // Save pristine baseline for difference detection
                    baselineMat = warpedGray.clone();
                    
                    // UI Transitions
                    targetGuide.classList.add('hidden');
                    setupOverlay.classList.add('hidden');
                    tableContainer.classList.remove('hidden');
                    bottomControls.classList.remove('hidden');
                    
                    showMessage("Tracking Started!", "success");
                    isTracking = true;
                    startTime = Date.now();
                    clockInterval = setInterval(updateClock, 1000);
                    
                    // Draw alignment verification on canvas
                    let displayMat = warpedFrame.clone();
                    cv.circle(displayMat, centerPoint, Math.round(bestBlackRadius > 0 ? bestBlackRadius : circles.data32F[2]), [0, 255, 0, 255], 2); 
                    cv.circle(displayMat, centerPoint, 2, [255, 0, 0, 255], 3); // Red center
                    
                    cv.warpPerspective(displayMat, frame, perspectiveTransform, new cv.Size(video.videoWidth, video.videoHeight), cv.INTER_LINEAR | cv.WARP_INVERSE_MAP);
                    cv.imshow('cv-canvas', frame);
                    
                    binaryBlack.delete(); blackContours.delete(); blackHierarchy.delete(); displayMat.delete();
                } else {
                    showMessage("Target rings not detected. Re-align.", "error");
                }
                
                frame.delete(); gray.delete(); thresh.delete(); hierarchy.delete(); contours.delete();
                srcTri.delete(); dstTri.delete(); warpedFrame.delete(); warpedGray.delete(); circles.delete();
            }, 50); 
        }

        function detectShot() {
            if(!isTracking || !baselineMat) return;
            
            let cap = new cv.VideoCapture(video);
            let frame = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            cap.read(frame);
            
            let warpedFrame = new cv.Mat();
            cv.warpPerspective(frame, warpedFrame, perspectiveTransform, new cv.Size(warpedWidth, warpedHeight));
            
            let warpedGray = new cv.Mat();
            cv.cvtColor(warpedFrame, warpedGray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(warpedGray, warpedGray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
            
            // Image Differencing (Background Subtraction)
            let diff = new cv.Mat();
            cv.absdiff(warpedGray, baselineMat, diff);
            
            let thresh = new cv.Mat();
            cv.threshold(diff, thresh, 40, 255, cv.THRESH_BINARY);
            
            let kernel = cv.Mat.ones(3, 3, cv.CV_8U);
            cv.erode(thresh, thresh, kernel);
            cv.dilate(thresh, thresh, kernel);
            
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
            
            let shotDetected = false;
            // 4.5mm pellet.
            let expectedPxDiameter = 4.5 * pxPerMm;
            let expectedArea = Math.PI * Math.pow(expectedPxDiameter / 2, 2);
            let minHoleArea = expectedArea * 0.4;
            let maxHoleArea = expectedArea * 2.5;
            
            let displayMat = warpedFrame.clone();
            
            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                
                if (area > minHoleArea && area < maxHoleArea) {
                    shotDetected = true;
                    
                    // Center-to-Center Math
                    let M = cv.moments(cnt);
                    let bulletCenterX = M.m10 / M.m00;
                    let bulletCenterY = M.m01 / M.m00;
                    
                    // Calculate the distance between the center of the target and the center of the bullet hole
                    let distancePx = Math.hypot(bulletCenterX - centerPoint.x, bulletCenterY - centerPoint.y);
                    let distanceMm = distancePx / pxPerMm;
                    
                    let score = calculateScore(distanceMm);
                    
                    registerShot(score);
                    
                    // Visualization
                    cv.drawContours(displayMat, contours, i, [255, 51, 102, 255], 2);
                    cv.circle(displayMat, new cv.Point(bulletCenterX, bulletCenterY), 3, [0, 255, 0, 255], -1);
                    cv.line(displayMat, centerPoint, new cv.Point(bulletCenterX, bulletCenterY), [0, 255, 0, 255], 1);
                    
                    // Update pristine baseline with the new hole so it is not scored twice
                    warpedGray.copyTo(baselineMat);
                    break; 
                }
                cnt.delete();
            }
            
            if(!shotDetected) {
               showMessage("No Change Detected", "error", 1500);
            }
            
            let outFrame = new cv.Mat();
            outFrame = cv.Mat.zeros(video.videoHeight, video.videoWidth, cv.CV_8UC4);
            cv.warpPerspective(displayMat, outFrame, perspectiveTransform, new cv.Size(video.videoWidth, video.videoHeight), cv.INTER_LINEAR | cv.WARP_INVERSE_MAP);
            
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            cv.imshow('cv-canvas', outFrame);
            
            frame.delete(); warpedFrame.delete(); warpedGray.delete(); diff.delete(); thresh.delete(); 
            kernel.delete(); contours.delete(); hierarchy.delete(); displayMat.delete(); outFrame.delete();
        }

        function calculateScore(distanceMm) {
            // Check center-to-center distance against fixed radius thresholds.
            // A bullet is 4.5mm. Max distance for a 10 is 10-ring radius (0.25mm) + bullet radius (2.25mm) = 2.50mm.
            if (distanceMm <= 2.50) return 10;
            if (distanceMm <= 5.00) return 9;
            if (distanceMm <= 7.50) return 8;
            if (distanceMm <= 10.00) return 7;
            if (distanceMm <= 12.50) return 6;
            if (distanceMm <= 15.00) return 5;
            if (distanceMm <= 17.50) return 4;
            if (distanceMm <= 20.00) return 3;
            if (distanceMm <= 22.50) return 2;
            if (distanceMm <= 25.00) return 1;
            return 0;
        }

        function registerShot(score) {
            let elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            let mins = Math.floor(elapsedSec / 60);
            let secs = elapsedSec % 60;
            let timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
            
            shots.push({ score, time: timeStr });
            totalScore += score;
            
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${shots.length}</td><td>${timeStr}</td><td style="font-weight:bold; color:var(--accent);">${score}</td>`;
            scoreBody.appendChild(tr);
            
            totalShotsEl.textContent = shots.length;
            totalScoreEl.textContent = totalScore;
            
            showMessage("Score Update!", "success", 2000);
            scoreBody.parentElement.parentElement.scrollTop = scoreBody.parentElement.parentElement.scrollHeight;
        }

        btnReset.addEventListener('click', () => {
            shots = [];
            totalScore = 0;
            scoreBody.innerHTML = '';
            totalShotsEl.textContent = '0';
            totalScoreEl.textContent = '0';
            clockDisplayEl.textContent = '0:00';
            
            if(clockInterval) clearInterval(clockInterval);
            startTime = Date.now();
            clockInterval = setInterval(updateClock, 1000);
            
            // Re-capture baseline
            captureBaseline();
        });
        
        btnEnd.addEventListener('click', () => {
            if(clockInterval) clearInterval(clockInterval);
            isTracking = false;
            releaseWakeLock();
            
            showMessage("Session Ended", "info", 0);
            btnTrack.disabled = true;
        });

    </script>
</body>
</html>
